[package]
name = "foundry"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "AI-native hybrid foundry for modern Rust projects (CLI + Core + template)"
license = "MIT OR Apache-2.0"
readme = "README.md"
authors = ["Robert Guss <robertguss@gmail.com>"]
repository = "https://github.com/robertguss/rust-foundry-cli"
keywords = ["foundry", "cli", "scaffold", "rust"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[[bin]]
name = "foundry"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
hex = "0.4.3"
sha2 = "0.11.0"
toml = "0.8"

[dev-dependencies]

[profile.dev]
# Keep defaults; product dogfood gates expand in later milestones.
